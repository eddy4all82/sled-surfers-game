<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Anas Sliding</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #cfe6f5; font-family: Inter, system-ui, sans-serif; touch-action: none; }
      canvas { display: block; width: 100%; height: 100%; }
      .hud { position: fixed; inset: 0; pointer-events: none; color: #f8fbff; text-shadow: 0 2px 10px rgba(0,0,0,.42); }
      .top { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: start; gap: 12px; }
      .brand { font-weight: 900; font-size: 20px; }
      .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; font-weight: 800; font-size: 13px; }
      .pill { background: rgba(12, 34, 54, .48); border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 8px 10px; backdrop-filter: blur(10px); }
      .panel { position: absolute; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 32px)); pointer-events: auto; text-align: center; background: rgba(10, 29, 47, .58); border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 22px; backdrop-filter: blur(14px); }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 16px; color: #d9eaf6; line-height: 1.45; font-size: 14px; }
      button { border: 0; border-radius: 8px; background: #0f6f95; color: white; font-weight: 900; font-size: 16px; padding: 12px 18px; cursor: pointer; }
      #pad { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; height: 45%; pointer-events: none; }
      body.playing #pad { pointer-events: auto; }
      .hint { position: absolute; left: 14px; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: rgba(248,251,255,.85); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud">
      <div class="top">
        <div class="brand">Anas Sliding</div>
        <div class="stats">
          <div class="pill" id="distance">0 m</div>
          <div class="pill" id="speed">0 km/h</div>
          <div class="pill" id="drops">0 drops</div>
        </div>
      </div>
      <div class="panel" id="start">
        <h1>Anas Sliding</h1>
        <p>Slide from upper snowy city terraces to lower streets, crossing roads, rails, fjords, fuel stations, trees, buildings, and ramps.</p>
        <button id="start-btn">Start</button>
      </div>
      <div id="pad"></div>
      <div class="hint"><span>Drag or A/D to steer</span><span>Tap / Space to jump</span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
